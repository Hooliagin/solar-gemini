services:
  # Backend Service (Web Service)
  - type: web
    name: daily-manager-backend
    runtime: python
    plan: free # Explicitly request Free plan
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      gunicorn main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        fromService:
          type: static # Frontend is now static
          name: daily-manager-frontend
          property: host

  # Frontend Service (Static Site)
  - type: static
    name: daily-manager-frontend
    buildCommand: |
      cd frontend
      npm install
      npm run build
    publishDir: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: daily-manager-backend
          property: url # Static sites need the full URL for build-time embedding usually, but let's stick to host if that's what worked, wait. Vite needs VITE_API_URL. My code handles host.
          # Actually, for static site building, we might as well give it the full URL if possible? 
          # Render 'url' property provides https://name.onrender.com.
          # My code handles host or url. Let's use 'url' here to be safe as static sites don't have runtime env vars, it's build time.
          # Wait, I previously changed 'url' to 'host' because of a validation error. 
          # Was the validation error because of the SERVICE type or the PROPERTY?
          # "invalid service property: url" for a WEB service.
          # Does a WEB service expose 'url'? Apparently not in blueprint? That's weird.
          # But 'host' is safer. My code handles 'host' -> 'https://host'.
          # So I will use 'host' here too.
          property: host
